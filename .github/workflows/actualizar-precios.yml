# Lee la planilla del Drive una vez por hora y, si cambió algo, actualiza web/data/catalogo.json.
# Ese commit dispara la publicación en Netlify. Si no cambió nada, no hace nada.
name: Actualizar precios desde el Drive

on:
  schedule:
    - cron: "7 * * * *"      # cada hora, en el minuto 7 (hora UTC)
  workflow_dispatch:          # botón "Run workflow" para actualizar ya

permissions:
  contents: write             # para poder commitear el catálogo

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar la clave de Google (solo lectura)
        env:
          GOOGLE_SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$GOOGLE_SA" > secrets/la-ribera-sync.json

      - name: Leer el Drive (precios)
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: secrets/la-ribera-sync.json
        run: python scripts/sync_drive.py

      # Fotos de la carpeta del Drive con el nombre del producto. Si falla, se publica igual.
      - name: Traer fotos nuevas del Drive
        continue-on-error: true
        env:
          GOOGLE_FOTOS_FOLDER_ID: ${{ secrets.GOOGLE_FOTOS_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: secrets/la-ribera-sync.json
        run: python scripts/fotos_drive.py

      - name: Armar el catálogo de la web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # para traer las fotos subidas desde el panel
        run: python scripts/armar_catalogo.py

      # Copia precios y costos a Supabase para que los pedidos y las estadísticas del panel
      # usen los mismos precios que la web. Si falla, la web se actualiza igual.
      - name: Actualizar la base del panel
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Sin DATABASE_URL: se saltea la base."; exit 0; fi
          python scripts/cargar_supabase.py

      - name: Publicar solo si cambió algo
        run: |
          if [ -z "$(git status --porcelain -- web/data web/img)" ]; then
            echo "Sin cambios en precios ni fotos. No se publica nada."
            exit 0
          fi
          git config user.name "la-ribera-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data web/img
          git commit -m "Precios y fotos actualizados desde el Drive"
          git push

      - name: Borrar la clave
        if: always()
        run: rm -f secrets/la-ribera-sync.json
